<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotify Player</title>
<style>
  :root {
    --accent: #1fdb6b;
    --accent-soft: #59f2bf;
    --violet: #8c61ff;
    --blue: #1a99ff;
    --text: #fff;
    --secondary: rgba(255,255,255,.5);
    --tertiary: rgba(255,255,255,.3);
    --stroke: rgba(255,255,255,.08);
    --spring: cubic-bezier(.34,1.56,.64,1);
    --ease: cubic-bezier(.22,1,.36,1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%; overflow: hidden;
    background: #0d0d10;
    font-family: "Segoe UI Variable Display", "Segoe UI", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--text);
    user-select: none; -webkit-user-select: none;
  }

  /* ---------- фон ---------- */
  .ambient { position: fixed; inset: 0; overflow: hidden; z-index: 0; }
  .ambient .base { position: absolute; inset: 0; background: linear-gradient(160deg, #15151b, #0a0a0d); }
  /* мягкие пятна без filter: blur — градиент уже размыт сам по себе, двигаем только transform */
  .blob { position: absolute; border-radius: 50%; will-change: transform; pointer-events: none; }
  .blob.a { width: 420px; height: 420px; left: -20px; top: 0;    background: radial-gradient(closest-side, rgba(31,219,107,.20), transparent); animation: drift-a 24s ease-in-out infinite; }
  .blob.b { width: 400px; height: 400px; right: -60px; top: -110px; background: radial-gradient(closest-side, rgba(140,97,255,.20), transparent); animation: drift-b 28s ease-in-out infinite; }
  .blob.c { width: 340px; height: 340px; left: 170px; top: 60px;  background: radial-gradient(closest-side, rgba(26,153,255,.10), transparent); animation: drift-c 32s ease-in-out infinite; }
  /* окно спрятано — ничего не анимируем и не тратим процессор */
  body:not(.shown) *, body:not(.shown) *::before, body:not(.shown) *::after { animation-play-state: paused !important; }
  @keyframes drift-a { 0%,100% { transform: translate3d(-80px, 10px, 0); } 50% { transform: translate3d(140px, 50px, 0); } }
  @keyframes drift-b { 0%,100% { transform: translate3d(40px, 0, 0); } 50% { transform: translate3d(-170px, 50px, 0); } }
  @keyframes drift-c { 0%,100% { transform: translate3d(-140px, -10px, 0); } 50% { transform: translate3d(150px, 30px, 0); } }
  .cover-glow {
    position: absolute; left: 0; top: 0; width: 160px; height: 74px;
    transform: scale(4.4); transform-origin: 0 0;
    background-size: cover; background-position: center;
    filter: blur(10px) saturate(1.5); opacity: 0; transition: opacity .6s ease;
  }
  .cover-glow.on { opacity: .45; }
  .vignette { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0) 0%, rgba(0,0,0,.35) 100%); }

  /* ---------- раскладка ---------- */
  /* Макет нарисован под 640×295. При масштабе Windows 125%/150% WebView
     увеличивает всё содержимое, и оно перестаёт влезать в окно — поэтому
     «сцена» всегда подгоняется под реальный размер окна (см. fitStage()). */
  #stage {
    position: relative; z-index: 1;
    width: 640px; height: 295px;
    transform-origin: 0 0;
  }
  .app {
    position: relative; z-index: 1; height: 100%;
    display: flex; flex-direction: column;
    padding: 24px 22px 16px;
    transform: scale(.955); opacity: 0;
    transition: transform .5s var(--spring), opacity .25s ease;
  }
  body.shown .app { transform: scale(1); opacity: 1; }
  .stagger { opacity: 0; transform: translateY(10px); transition: opacity .45s var(--ease), transform .5s var(--spring); }
  body.shown .stagger { opacity: 1; transform: none; }
  body.shown .s1 { transition-delay: .045s; }
  body.shown .s2 { transition-delay: .09s; }
  body.shown .s3 { transition-delay: .135s; }

  /* drag-зона окна (pywebview) */
  .header { display: flex; align-items: center; gap: 11px; }
  .title { font-size: 15px; font-weight: 700; letter-spacing: .1px; }
  .subtitle { font-size: 11px; color: var(--secondary); margin-top: 3px; height: 15px; position: relative; }
  .subtitle span { position: absolute; left: 0; white-space: nowrap; transition: opacity .25s, transform .3s var(--spring); }
  .subtitle .searching { opacity: 0; transform: translateY(4px);
    background: linear-gradient(90deg, var(--secondary) 0%, var(--secondary) 40%, var(--accent-soft) 50%, var(--secondary) 60%, var(--secondary) 100%);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: shimmer 1.1s linear infinite; }
  body.loading .subtitle .idle { opacity: 0; transform: translateY(-4px); }
  body.loading .subtitle .searching { opacity: 1; transform: none; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
  .spacer { flex: 1; }
  .keys { display: flex; gap: 4px; align-items: center; }
  .key {
    font-size: 9px; font-weight: 600; color: var(--tertiary); white-space: nowrap;
    padding: 3px 7px; border-radius: 6px; background: rgba(255,255,255,.07);
  }

  /* ---------- поиск ---------- */
  .search {
    margin-top: 16px; display: flex; align-items: center; gap: 12px;
    padding: 6px 6px 6px 15px; border-radius: 22px;
    background: rgba(255,255,255,.07);
    position: relative;
    transition: background .25s ease, box-shadow .25s ease;
  }
  .search:focus-within { background: rgba(255,255,255,.11); box-shadow: 0 6px 24px rgba(0,0,0,.25); }
  .search svg.mag { width: 15px; height: 15px; color: var(--tertiary); transition: color .2s, transform .3s var(--spring); flex: none; }
  .search:focus-within svg.mag { color: var(--accent); transform: scale(1.08); }
  .search input {
    flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: var(--text);
    font-size: 16px; font-weight: 500; font-family: inherit; user-select: text; -webkit-user-select: text;
  }
  .search input::placeholder { color: rgba(255,255,255,.35); }
  .clear { border: 0; background: none; color: var(--tertiary); cursor: pointer; font-size: 14px; line-height: 1;
    transition: transform .25s var(--spring), opacity .2s; }
  .clear.hidden { opacity: 0; transform: scale(.5); pointer-events: none; }
  .play-btn {
    width: 68px; height: 32px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(135deg, var(--accent-soft), var(--accent)); color: #000;
    font-size: 12px; font-weight: 700; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px;
    box-shadow: 0 2px 10px rgba(31,219,107,.45);
    transition: transform .25s var(--spring), opacity .2s, box-shadow .2s;
  }
  .play-btn:hover { transform: scale(1.04); }
  .play-btn:active { transform: scale(.9); }
  .play-btn:disabled { opacity: .4; box-shadow: none; cursor: default; transform: none; }
  .spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid rgba(0,0,0,.25); border-top-color: #000; animation: spin .7s linear infinite; display: none; }
  body.loading .play-btn .spinner { display: block; }
  body.loading .play-btn .lbl { display: none; }
  body.loading .play-btn { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- середина ---------- */
  .middle { flex: 1; margin-top: 12px; position: relative; display: flex; align-items: center; }
  .empty { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 10px;
    font-size: 12px; font-weight: 500; color: var(--tertiary); transition: opacity .3s; }
  body.has-track .empty { opacity: 0; pointer-events: none; }

  .card {
    width: 100%; display: flex; align-items: center; gap: 15px; padding: 12px; border-radius: 18px;
    background: rgba(255,255,255,.055); position: relative;
    opacity: 0; transform: translateY(16px) scale(.96); pointer-events: none;
    transition: opacity .35s ease, transform .5s var(--spring);
  }
  body.has-track .card { opacity: 1; transform: none; pointer-events: auto; }

  .cover {
    width: 66px; height: 66px; border-radius: 14px; flex: none; position: relative; overflow: hidden;
    background: linear-gradient(135deg, rgba(140,97,255,.35), rgba(31,219,107,.25));
    box-shadow: 0 3px 6px rgba(0,0,0,.45); transform: scale(.92);
    transition: transform .5s var(--spring), box-shadow .5s;
  }
  body.playing .cover { transform: scale(1); box-shadow: 0 6px 12px rgba(0,0,0,.45); }
  .cover img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .35s; }
  .cover img.on { opacity: 1; }
  .cover .note { position: absolute; inset: 0; display: grid; place-items: center; color: rgba(255,255,255,.6); font-size: 20px; }

  .info { flex: 1; min-width: 0; overflow: hidden; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 9px; font-weight: 700; letter-spacing: 1.2px; color: var(--tertiary); }
  body.playing .status { color: var(--accent); }
  .eq { display: flex; align-items: flex-end; gap: 1.5px; height: 10px; width: 13px; }
  .eq i { flex: 1; background: currentColor; border-radius: 2px; height: 100%; transform: scaleY(.25); transform-origin: bottom; }
  body.playing .card .eq i { animation: eq .9s ease-in-out infinite alternate; }
  .eq i:nth-child(2) { animation-delay: -.3s !important; }
  .eq i:nth-child(3) { animation-delay: -.6s !important; }
  .eq i:nth-child(4) { animation-delay: -.15s !important; }
  @keyframes eq { 0% { transform: scaleY(.25); } 50% { transform: scaleY(1); } 100% { transform: scaleY(.4); } }
  .names { margin-top: 4px; transition: opacity .25s, transform .35s var(--spring); }
  .names.swap { opacity: 0; transform: translateX(14px); }
  .song { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { font-size: 12px; font-weight: 500; color: var(--secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }

  .progress { display: flex; align-items: center; gap: 8px; margin-top: 7px; font-size: 9px; font-weight: 600; color: var(--tertiary); font-variant-numeric: tabular-nums; }
  .progress .t { width: 30px; }
  .progress .t:last-child { text-align: right; }
  .bar { flex: 1; height: 12px; display: flex; align-items: center; cursor: pointer; }
  .bar .track { position: relative; width: 100%; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); }
  .bar .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; border-radius: 4px;
    transform: scaleX(0); transform-origin: left; transition: transform .25s linear;
    background: linear-gradient(90deg, var(--accent), var(--accent-soft)); }

  .controls { display: flex; align-items: center; gap: 8px; flex: none; }
  .ibtn {
    width: 32px; height: 32px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center;
    background: rgba(255,255,255,.06); color: rgba(255,255,255,.7);
    transition: transform .28s var(--spring), background .2s, color .2s, box-shadow .2s;
  }
  .ibtn:hover { transform: scale(1.08); background: rgba(255,255,255,.14); color: #fff; }
  .ibtn:active { transform: scale(.9); }
  .ibtn svg { width: 12px; height: 12px; }
  .ibtn.big { width: 42px; height: 42px; background: linear-gradient(#fff, rgba(255,255,255,.85)); color: #000; box-shadow: 0 0 6px rgba(255,255,255,.15); }
  .ibtn.big:hover { box-shadow: 0 0 12px rgba(255,255,255,.35); }
  .ibtn.big svg { width: 15px; height: 15px; }
  .ibtn.like { background: transparent; margin-right: 2px; }
  .ibtn.like:hover { background: rgba(255,255,255,.1); }
  .ibtn.like svg { width: 16px; height: 16px; }
  .ibtn.like.on { color: var(--accent); filter: drop-shadow(0 0 6px rgba(31,219,107,.6)); }
  .ibtn.like.pop svg { animation: pop .45s var(--spring); }
  .ibtn:disabled { opacity: .35; cursor: default; transform: none; }
  @keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.35); } 100% { transform: scale(1); } }

  /* ---------- низ ---------- */
  .bottom { display: flex; align-items: center; margin-top: 10px; height: 20px; }
  .tg { border: 0; background: none; color: var(--tertiary); font-size: 10px; font-weight: 500; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; gap: 6px; padding: 4px 8px; border-radius: 999px; transition: background .2s, transform .25s var(--spring); }
  .tg:hover { background: rgba(255,255,255,.08); }
  .tg:active { transform: scale(.94); }
  .tg svg { width: 9px; height: 9px; }
  .hint { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 500; color: var(--tertiary); transition: opacity .25s; }
  .hint .ctl { display: none; align-items: center; gap: 4px; margin-right: 6px; }
  body.has-track .hint .ctl { display: flex; }
  .msg { font-size: 10px; font-weight: 500; display: flex; align-items: center; gap: 5px; max-width: 380px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--accent);
    opacity: 0; transform: translateY(6px); transition: opacity .25s, transform .3s var(--spring); position: absolute; right: 22px; }
  .msg.err { color: #ff7373; }
  body.has-msg .msg { opacity: 1; transform: none; }
  body.has-msg .hint { opacity: 0; }
</style>
</head>
<body>
  <div class="ambient">
    <div class="base"></div>
    <div class="blob a"></div><div class="blob b"></div><div class="blob c"></div>
    <div class="cover-glow" id="coverGlow"></div>
    <div class="vignette"></div>
  </div>

  <div id="stage">
  <div class="app">
    <div class="header stagger pywebview-drag-region">
      <div>
        <div class="title">Spotify Player</div>
        <div class="subtitle">
          <span class="idle">What would you like to listen to?</span>
          <span class="searching">Searching the vibe…</span>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="keys"><span class="key">Shift</span><span class="key">Space</span></div>
    </div>

    <form class="search stagger s1" id="form" autocomplete="off">
      <svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" placeholder="Track, artist or vibe…" spellcheck="false" autofocus>
      <button type="button" class="clear hidden" id="clear" tabindex="-1">✕</button>
      <button type="submit" class="play-btn" id="playBtn" disabled>
        <span class="lbl">▶&nbsp;Play</span><span class="spinner"></span>
      </button>
    </form>

    <div class="middle stagger s2">
      <div class="empty">
        <div class="eq"><i></i><i></i><i></i><i></i></div>
        Nothing playing yet — type something above
      </div>

      <div class="card">
        <div class="cover"><div class="note">♪</div><img id="cover" alt=""></div>
        <div class="info">
          <div class="status"><div class="eq"><i></i><i></i><i></i><i></i></div><span id="statusText">PAUSED</span></div>
          <div class="names" id="names">
            <div class="song" id="song"></div>
            <div class="artist" id="artist"></div>
          </div>
          <div class="progress">
            <span class="t" id="tCur">0:00</span>
            <div class="bar" id="bar"><div class="track"><div class="fill" id="fill"></div></div></div>
            <span class="t" id="tDur">0:00</span>
          </div>
        </div>
        <button class="ibtn like" id="like" title="Like (Ctrl+L)" disabled>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path id="heartPath" d="M12 20.5s-7.5-4.6-9.3-9.2C1.4 8 3.6 4.5 7.2 4.5c2 0 3.4 1.1 4.8 2.9 1.4-1.8 2.8-2.9 4.8-2.9 3.6 0 5.8 3.5 4.5 6.8-1.8 4.6-9.3 9.2-9.3 9.2z"/></svg>
        </button>
        <div class="controls">
          <button class="ibtn" id="prev" title="Previous (Ctrl+←)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M11 6v12L2.5 12zM21 6v12l-8.5-6z"/></svg></button>
          <button class="ibtn big" id="toggle" title="Play / Pause (Ctrl+P)">
            <svg id="icoPlay" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M7 4.5v15l13-7.5z"/></svg>
            <svg id="icoPause" viewBox="0 0 24 24" fill="currentColor"><rect x="5.5" y="4.5" width="4.5" height="15" rx="1.2"/><rect x="14" y="4.5" width="4.5" height="15" rx="1.2"/></svg>
          </button>
          <button class="ibtn" id="next" title="Next (Ctrl+→)"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 6v12l8.5-6zM3 6v12l8.5-6z"/></svg></button>
        </div>
      </div>
    </div>

    <div class="bottom stagger s3">
      <button class="tg" id="tg"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 11.5 21.5 3l-3.3 18-6.4-5.1-3.4 3.2.5-5.2 9.1-8.3-11.3 6.9z"/></svg>@tenssage</button>
      <div class="spacer"></div>
      <div class="hint">
        <span class="ctl"><span class="key">Ctrl←</span><span class="key">Ctrl P</span><span class="key">Ctrl→</span><span class="key">Ctrl L</span>&nbsp;control</span>
        <span class="key">esc</span>&nbsp;close
      </div>
      <div class="msg" id="msg"></div>
    </div>
  </div>
  </div>

<script>
const $ = (id) => document.getElementById(id);
const body = document.body;

// Подгоняем макет 640×295 под фактический размер окна (масштаб Windows 100–200%).
function fitStage() {
  const k = Math.min(window.innerWidth / 640, window.innerHeight / 295);
  $("stage").style.transform = `scale(${k})`;
}
fitStage();
window.addEventListener("resize", fitStage);
const api = () => (window.pywebview && window.pywebview.api) || null;

const state = {
  song: "", artist: "", image: "", id: "",
  playing: false, liked: false,
  progress: 0, duration: 0, stamp: performance.now(),
  visible: true, loading: false,
  // что мы только что попросили у Spotify; пока он не подтвердит — его старые ответы игнорируем
  expect: null,
};

// ---------- сеть ----------
async function request(path, method = "GET", data) {
  try {
    const res = await fetch(path, {
      method,
      headers: data ? { "Content-Type": "application/json" } : {},
      body: data ? JSON.stringify(data) : undefined,
    });
    const json = await res.json();
    if (json.success) return [json, null];
    return [json, json.error || "Something went wrong"];
  } catch (e) {
    return [null, "Server is starting… try again in a second"];
  }
}

// ---------- сообщения ----------
let msgTimer;
function showMessage(text, isError = false) {
  const el = $("msg");
  el.textContent = (isError ? "⚠ " : "✓ ") + text;
  el.classList.toggle("err", isError);
  body.classList.add("has-msg");
  clearTimeout(msgTimer);
  msgTimer = setTimeout(() => body.classList.remove("has-msg"), isError ? 6000 : 2500);
}

// ---------- отрисовка ----------
const fmt = (ms) => { const s = Math.max(0, Math.floor(ms / 1000)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; };

function setTrack(song, artist, image) {
  const changed = song !== state.song || artist !== state.artist;
  if (changed && state.song) {
    $("names").classList.add("swap");
    setTimeout(() => { $("song").textContent = song; $("artist").textContent = artist; $("names").classList.remove("swap"); }, 180);
  } else {
    $("song").textContent = song; $("artist").textContent = artist;
  }
  if (image !== state.image) {
    const img = $("cover");
    img.classList.remove("on");
    if (image) { img.onload = () => img.classList.add("on"); img.src = image; }
    const glow = $("coverGlow");
    glow.classList.remove("on");
    if (image) { glow.style.backgroundImage = `url("${image}")`; requestAnimationFrame(() => glow.classList.add("on")); }
  }
  state.song = song; state.artist = artist; state.image = image;
  body.classList.toggle("has-track", !!song);
}

function setPlaying(playing) {
  state.playing = playing;
  body.classList.toggle("playing", playing);
  $("statusText").textContent = playing ? "NOW PLAYING" : "PAUSED";
  $("icoPlay").style.display = playing ? "none" : "";
  $("icoPause").style.display = playing ? "" : "none";
}

function setLiked(liked, pop = false) {
  state.liked = liked;
  const btn = $("like");
  btn.classList.toggle("on", liked);
  $("heartPath").setAttribute("fill", liked ? "currentColor" : "none");
  if (pop) { btn.classList.remove("pop"); void btn.offsetWidth; btn.classList.add("pop"); }
  btn.disabled = !state.id;
}

function livePosition() {
  if (!state.playing) return state.progress;
  return Math.min(state.duration, state.progress + (performance.now() - state.stamp));
}

let lastCur = "", lastDur = "";
function tick() {
  if (!state.visible) return;
  const pos = livePosition();
  const cur = fmt(pos), dur = fmt(state.duration);
  if (cur !== lastCur) { $("tCur").textContent = cur; lastCur = cur; }
  if (dur !== lastDur) { $("tDur").textContent = dur; lastDur = dur; }
  $("fill").style.transform = `scaleX(${state.duration ? Math.min(1, pos / state.duration) : 0})`;
}
setInterval(tick, 250);

function setLoading(on) {
  state.loading = on;
  body.classList.toggle("loading", on);
  updatePlayButton();
}

function updatePlayButton() {
  const has = $("q").value.trim().length > 0;
  $("playBtn").disabled = !has || state.loading;
  $("clear").classList.toggle("hidden", !$("q").value || state.loading);
}

// ---------- действия ----------
// Spotify применяет команды с задержкой в 1–3 секунды и всё это время отдаёт старое
// состояние. Без этой проверки после паузы на пару секунд снова мелькало «NOW PLAYING».
function expectChange(what, ms = 5000) {
  state.expect = { ...what, until: performance.now() + ms };
}

function isStale(json) {
  const e = state.expect;
  if (!e) return false;
  if (performance.now() > e.until) { state.expect = null; return false; }  // ждали достаточно
  const t = json.track || {};
  const stale =
    (e.playing !== undefined && !!json.playing !== e.playing) ||
    (e.trackFrom !== undefined && t.id === e.trackFrom) ||
    (e.trackTo !== undefined && t.id !== e.trackTo) ||
    (e.seekTo !== undefined && Math.abs((json.progress_ms || 0) - e.seekTo) > 4000);
  if (!stale) state.expect = null;  // Spotify подтвердил — дальше верим ему
  return stale;
}

async function refreshState() {
  const [json, err] = await request("/native-state");
  if (err || !json) return;
  if (isStale(json)) return;          // устаревший ответ — не перерисовываем
  const t = json.track;
  if (t) {
    setTrack(t.name || "", t.artist || "", t.image_url || "");
    state.id = t.id || "";
    setLiked(!!t.liked);
  }
  setPlaying(!!json.playing);
  state.progress = json.progress_ms || 0;
  state.duration = json.duration_ms || 0;
  state.stamp = performance.now();
}

async function play() {
  const q = $("q").value.trim();
  if (!q || state.loading) return;
  setLoading(true);
  const [json, err] = await request("/native-play", "POST", { prompt: q });
  setLoading(false);
  if (err) { showMessage(err, true); return; }

  setTrack(json.name || q, json.artist || "", json.image_url || "");
  state.id = json.id || "";
  setLiked(false);
  setPlaying(true);
  expectChange(json.kind === "artist" ? { playing: true } : { trackTo: state.id, playing: true });
  state.progress = 0; state.duration = json.duration_ms || 0; state.stamp = performance.now();
  $("q").value = ""; updatePlayButton();
  showMessage("Playing");
  setTimeout(refreshState, 800);
  setTimeout(hide, 1600);
}

async function control(action, extra = {}) {
  if (action === "next" || action === "previous") expectChange({ trackFrom: state.id });
  if (action === "seek") expectChange({ seekTo: extra.position_ms }, 3000);
  const [, err] = await request("/native-control", "POST", { action, ...extra });
  if (err) { showMessage(err, true); state.expect = null; }
  setTimeout(refreshState, 700);
}

async function toggleLike() {
  if (!state.id) return;
  const value = !state.liked;
  setLiked(value, value);
  const [, err] = await request("/native-like", "POST", { id: state.id, liked: value });
  if (!err) { showMessage(value ? "Added to Liked Songs" : "Removed from Liked Songs"); return; }
  setLiked(!value);
  if (err.includes("login")) {
    showMessage("Log in again in the browser to enable likes", true);
    openUrl("http://127.0.0.1:8888/login");
  } else {
    showMessage(err, true);
  }
}

function openUrl(url) {
  if (api()) api().open_url(url); else window.open(url, "_blank");
}

function hide() {
  body.classList.remove("shown");
  state.visible = false;
  if (api()) setTimeout(() => api().hide(), 140);
}

// вызывается из Python при показе окна
window.onShown = () => {
  state.visible = true;
  body.classList.remove("shown");
  void body.offsetWidth;
  requestAnimationFrame(() => body.classList.add("shown"));
  refreshState();
  tick();
  setTimeout(() => $("q").focus(), 60);
};

// ---------- события ----------
$("form").addEventListener("submit", (e) => { e.preventDefault(); play(); });
$("q").addEventListener("input", updatePlayButton);
$("clear").addEventListener("click", () => { $("q").value = ""; updatePlayButton(); $("q").focus(); });
$("prev").addEventListener("click", () => control("previous"));
$("next").addEventListener("click", () => control("next"));
$("toggle").addEventListener("click", () => {
  const next = !state.playing;
  state.progress = livePosition(); state.stamp = performance.now();
  setPlaying(next);
  expectChange({ playing: next });
  control(next ? "play" : "pause");
});
$("like").addEventListener("click", toggleLike);
$("tg").addEventListener("click", () => openUrl("https://t.me/tenssage"));
$("bar").addEventListener("click", (e) => {
  if (!state.duration) return;
  const r = e.currentTarget.getBoundingClientRect();
  const pos = Math.round(state.duration * Math.min(1, Math.max(0, (e.clientX - r.left) / r.width)));
  state.progress = pos; state.stamp = performance.now();
  control("seek", { position_ms: pos });
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.preventDefault(); hide(); return; }
  const mod = e.ctrlKey || e.metaKey;
  if (!mod) return;
  if (e.key === "ArrowLeft") { e.preventDefault(); control("previous"); }
  else if (e.key === "ArrowRight") { e.preventDefault(); control("next"); }
  else if (e.key.toLowerCase() === "p") { e.preventDefault(); $("toggle").click(); }
  else if (e.key.toLowerCase() === "l") { e.preventDefault(); toggleLike(); }
});

// опрос состояния, пока окно открыто
setInterval(() => { if (state.visible && !state.loading) refreshState(); }, 1500);

// в обычном браузере (для проверки дизайна) окно «показано» сразу
window.addEventListener("load", () => { if (!api()) window.onShown(); });
window.addEventListener("pywebviewready", () => window.onShown());
</script>
</body>
</html>
