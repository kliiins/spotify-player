# Собирает SpotifyPlayer.exe на Windows-сервере GitHub и прикладывает его к релизу.
# Запускается сам при публикации релиза; можно запустить и вручную (вкладка Actions).
name: Windows build

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Draw icon
        run: python make_icon.py

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir
          --name SpotifyPlayer
          --icon icon.ico
          --add-data "ui;ui"
          --paths ..\server
          --hidden-import pystray._win32
          --collect-submodules webview
          main.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist\SpotifyPlayer -DestinationPath SpotifyPlayer-Windows.zip

      - name: Attach to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" SpotifyPlayer-Windows.zip --clobber

      - name: Upload artifact (manual run)
        if: github.event_name != 'release'
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyPlayer-Windows
          path: windows/SpotifyPlayer-Windows.zip
